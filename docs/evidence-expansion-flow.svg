<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Evidence Expansion 新流程</title><desc id="desc">加入受限第二輪原文回查的七步證據擴展流程，以汽車 P0301 故障碼為例。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#F8FBFE"/><stop offset="1" stop-color="#EAF3F8"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dy="4" stdDeviation="5" flood-color="#17324D" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#526F84"/></marker><style>.f{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.t{font-size:38px;font-weight:700;fill:#17324D}.st{font-size:18px;fill:#60788C}.h{font-size:21px;font-weight:700;fill:#17324D}.b{font-size:16px;fill:#405B70}.e{font-size:15px;font-weight:600;fill:#1E6088}.n{font-size:17px;font-weight:700;fill:#fff}.wt{font-size:22px;font-weight:700;fill:#fff}.wb{font-size:16px;fill:#EAF7FF}.ar{fill:none;stroke:#526F84;stroke-width:3;marker-end:url(#a)}</style></defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<text x="800" y="50" text-anchor="middle" class="f t">Evidence Expansion：加入第二輪原文回查</text>
<text x="800" y="80" text-anchor="middle" class="f st">汽車維修例：P0301 → 第 1 缸失火 → 火星塞｜箭頭表示處理順序</text>

<!-- Row 1 -->
<g filter="url(#s)"><rect x="60" y="120" width="430" height="165" rx="20" fill="#E3F2FD" stroke="#3C91C7" stroke-width="2"/><circle cx="100" cy="160" r="20" fill="#3C91C7"/><text x="100" y="166" text-anchor="middle" class="f n">1</text><text x="135" y="158" class="f h">Hybrid Search 初始命中</text><text x="85" y="197" class="f b">可能命中原文、實體或關係證據節點。</text><text x="85" y="230" class="f e">例：命中「P0301」實體描述</text><text x="85" y="258" class="f b">保留融合分數及文件、頁碼、Chunk。</text></g>
<path d="M490 202H555" class="ar"/>

<g filter="url(#s)"><rect x="560" y="120" width="430" height="165" rx="20" fill="#FFF3E0" stroke="#E29A2D" stroke-width="2"/><circle cx="600" cy="160" r="20" fill="#E29A2D"/><text x="600" y="166" text-anchor="middle" class="f n">2</text><text x="635" y="158" class="f h">收集擴展線索</text><text x="585" y="197" class="f b">所有命中證據：收集 Chunk 編號。</text><text x="585" y="230" class="f b">命中實體證據：額外收集實體名稱。</text><text x="585" y="258" class="f e">例：Chunk 35；名稱「P0301」</text></g>
<path d="M990 202H1055" class="ar"/>

<g filter="url(#s)"><rect x="1060" y="120" width="480" height="165" rx="20" fill="#FFF8E6" stroke="#D69E2E" stroke-width="2"/><circle cx="1100" cy="160" r="20" fill="#D69E2E"/><text x="1100" y="166" text-anchor="middle" class="f n">3</text><text x="1135" y="158" class="f h">第一輪原文回查</text><text x="1085" y="197" class="f b">依初始實體／關係證據的 Chunk，</text><text x="1085" y="225" class="f b">找回完整 PDF 原文。</text><text x="1085" y="258" class="f e">例：第 86 頁「P0301 表示第 1 缸失火……」</text></g>
<path d="M1300 285V345" class="ar"/>

<!-- Row 2, right to left -->
<g filter="url(#s)"><rect x="1060" y="350" width="480" height="165" rx="20" fill="#E8F7F0" stroke="#35976A" stroke-width="2"/><circle cx="1100" cy="390" r="20" fill="#35976A"/><text x="1100" y="396" text-anchor="middle" class="f n">4</text><text x="1135" y="388" class="f h">擴展實體證據</text><text x="1085" y="427" class="f b">尋找同名或來自相同 Chunk 的實體。</text><text x="1085" y="460" class="f e">例：第 1 缸失火、火星塞、點火線圈</text><text x="1085" y="488" class="f b">最多取得 retrieval_top_k 筆。</text></g>
<path d="M1060 432H995" class="ar"/>

<g filter="url(#s)"><rect x="560" y="350" width="430" height="165" rx="20" fill="#EDE8FA" stroke="#7659C5" stroke-width="2"/><circle cx="600" cy="390" r="20" fill="#7659C5"/><text x="600" y="396" text-anchor="middle" class="f n">5</text><text x="635" y="388" class="f h">擴展關係證據</text><text x="585" y="427" class="f b">關係起訖符合擴展實體，</text><text x="585" y="455" class="f b">或關係來自相同 Chunk。</text><text x="585" y="483" class="f e">例：第 1 缸失火 ─可能原因→</text><text x="585" y="507" class="f e">火星塞</text></g>
<path d="M560 432H495" class="ar"/>

<g filter="url(#s)"><rect x="60" y="350" width="430" height="165" rx="20" fill="#FDEBEC" stroke="#C85B67" stroke-width="2"/><circle cx="100" cy="390" r="20" fill="#C85B67"/><text x="100" y="396" text-anchor="middle" class="f n">6</text><text x="135" y="388" class="f h">第二輪原文回查</text><text x="85" y="427" class="f b">收集步驟 4、5 新增的 Chunk，</text><text x="85" y="455" class="f b">排除已取得原文後，再回查一次。</text><text x="85" y="483" class="f e">最多 retrieval_top_k 筆；不再遞迴擴展</text></g>
<path d="M275 515V580C275 605 315 620 355 620" class="ar"/>

<!-- Final -->
<g filter="url(#s)"><rect x="360" y="580" width="880" height="185" rx="22" fill="#173F5F"/><circle cx="410" cy="630" r="22" fill="#2D78A3"/><text x="410" y="636" text-anchor="middle" class="f n">7</text><text x="450" y="625" class="f wt">合併完整證據</text><text x="410" y="666" class="f wb">初始命中＋第一輪原文＋實體證據＋關係證據＋第二輪原文</text><line x1="410" y1="690" x2="1190" y2="690" stroke="#6E91AA" stroke-width="1.5"/><text x="410" y="720" class="f wb">依證據 ID 去重，經可選 Local Reranker 後取 Top K 供 LLM 回答。</text><text x="410" y="748" class="f wb">結果仍保留來源文件、頁碼及 Chunk，可回頭核對維修手冊。</text></g>
<path d="M800 765V805" class="ar"/>
<rect x="460" y="808" width="680" height="60" rx="18" fill="#FFFFFF" stroke="#5D7C91" stroke-width="2"/>
<text x="800" y="845" text-anchor="middle" class="f b">停止擴展：不執行第三輪回查，也不直接遍歷實體關係邊</text>
</svg>