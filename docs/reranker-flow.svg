<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">本機 Reranker 運作流程</title>
  <desc id="desc">說明本專案如何擴大召回候選，將問題與證據斷詞，依詞彙重疊、完整命中、Hybrid 分數及原文類型加分，排序後選出 Top K 證據。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAFC"/>
      <stop offset="1" stop-color="#EAF2F8"/>
    </linearGradient>
    <linearGradient id="scoreBackground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8F7F0"/>
      <stop offset="1" stop-color="#DDF4E8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#18324A" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#46627A"/>
    </marker>
    <style>
      .font { font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
      .mono { font-family: "JetBrains Mono", "Noto Sans Mono CJK TC", monospace; }
      .title { font-size: 38px; font-weight: 700; fill: #17324D; }
      .subtitle { font-size: 18px; fill: #587086; }
      .box-title { font-size: 22px; font-weight: 700; fill: #17324D; }
      .body { font-size: 16px; fill: #425B70; }
      .small { font-size: 14px; fill: #587086; }
      .formula { font-size: 18px; font-weight: 700; fill: #176B47; }
      .white-title { font-size: 22px; font-weight: 700; fill: #FFFFFF; }
      .white-body { font-size: 16px; fill: #EAF7FF; }
      .arrow { fill: none; stroke: #46627A; stroke-width: 3; marker-end: url(#arrow); }
      .divider { stroke: #B7C6D3; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>
  <text x="800" y="58" text-anchor="middle" class="font title">本機 Reranker 如何重新排序證據</text>
  <text x="800" y="88" text-anchor="middle" class="font subtitle">規則式加權排序：不呼叫額外模型，也不將候選內容傳送至外部服務</text>

  <!-- Candidate recall -->
  <g filter="url(#shadow)">
    <rect x="90" y="130" width="360" height="135" rx="20" fill="#E8E5FA" stroke="#7357C8" stroke-width="2"/>
    <circle cx="140" cy="178" r="26" fill="#7357C8"/>
    <text x="140" y="186" text-anchor="middle" class="font white-title">1</text>
    <text x="182" y="174" class="font box-title">擴大召回候選</text>
    <text x="182" y="206" class="font body">Hybrid Search 先取較多結果</text>
    <text x="182" y="235" class="mono formula">min(Top K × 3, 50)</text>
  </g>

  <path d="M 450 198 L 585 198" class="arrow"/>

  <!-- Tokenization -->
  <g filter="url(#shadow)">
    <rect x="590" y="130" width="420" height="135" rx="20" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
    <circle cx="640" cy="178" r="26" fill="#2196F3"/>
    <text x="640" y="186" text-anchor="middle" class="font white-title">2</text>
    <text x="682" y="174" class="font box-title">問題與證據斷詞</text>
    <text x="682" y="205" class="font body">英文／數字：完整 token</text>
    <text x="682" y="233" class="font body">中文：相鄰兩字 bigram</text>
  </g>

  <path d="M 1010 198 L 1145 198" class="arrow"/>

  <!-- Score each candidate -->
  <g filter="url(#shadow)">
    <rect x="1150" y="130" width="360" height="135" rx="20" fill="#E8F7F0" stroke="#2E9D68" stroke-width="2"/>
    <circle cx="1200" cy="178" r="26" fill="#2E9D68"/>
    <text x="1200" y="186" text-anchor="middle" class="font white-title">3</text>
    <text x="1242" y="174" class="font box-title">逐筆計算分數</text>
    <text x="1242" y="205" class="font body">四項訊號加權合計</text>
    <text x="1242" y="233" class="font body">保留原始順位供同分判定</text>
  </g>

  <!-- Scoring formula -->
  <g filter="url(#shadow)">
    <rect x="90" y="320" width="1420" height="245" rx="22" fill="url(#scoreBackground)" stroke="#2E9D68" stroke-width="2"/>
    <text x="800" y="362" text-anchor="middle" class="font box-title">Rerank 分數公式</text>
    <text x="800" y="405" text-anchor="middle" class="mono formula">rerank_score = 詞彙重疊率 × 2 ＋ 完整關鍵詞命中數 × 0.25 ＋ Hybrid 分數 ＋ 原文加分</text>

    <line x1="445" y1="435" x2="445" y2="535" class="divider"/>
    <line x1="800" y1="435" x2="800" y2="535" class="divider"/>
    <line x1="1155" y1="435" x2="1155" y2="535" class="divider"/>

    <text x="267" y="466" text-anchor="middle" class="font box-title">詞彙重疊率 × 2</text>
    <text x="267" y="498" text-anchor="middle" class="font body">共同詞彙數 ÷ 問題詞彙數</text>
    <text x="267" y="525" text-anchor="middle" class="font small">衡量證據與問題的直接相關程度</text>

    <text x="622" y="466" text-anchor="middle" class="font box-title">完整命中 × 0.25</text>
    <text x="622" y="498" text-anchor="middle" class="font body">長度至少 3 的問題詞彙</text>
    <text x="622" y="525" text-anchor="middle" class="font small">例如錯誤碼 E01 或英文關鍵詞</text>

    <text x="977" y="466" text-anchor="middle" class="font box-title">Hybrid 原始分數</text>
    <text x="977" y="498" text-anchor="middle" class="font body">fusion_score；缺少時使用 score</text>
    <text x="977" y="525" text-anchor="middle" class="font small">保留向量與全文搜尋的排序訊號</text>

    <text x="1332" y="466" text-anchor="middle" class="font box-title">原文加分 ＋ 0.05</text>
    <text x="1332" y="498" text-anchor="middle" class="font body">kind 等於「原文」時加入</text>
    <text x="1332" y="525" text-anchor="middle" class="font small">輕微偏好可直接引用的 PDF 片段</text>
  </g>

  <!-- Example -->
  <text x="90" y="620" class="font box-title">範例：問題「E01 怎麼處理？」</text>

  <g filter="url(#shadow)">
    <rect x="90" y="650" width="505" height="175" rx="18" fill="#FFFFFF" stroke="#91A4B5" stroke-width="2"/>
    <text x="125" y="688" class="font box-title">候選 A</text>
    <text x="125" y="722" class="font body">「一般保養與清潔方式」</text>
    <text x="125" y="756" class="font body">Hybrid 分數較高，但沒有命中 E01</text>
    <text x="125" y="793" class="mono small">詞彙重疊 0 ＋ Hybrid 0.20 = 0.20</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="660" y="650" width="575" height="175" rx="18" fill="#FFF8E6" stroke="#D69E2E" stroke-width="2"/>
    <text x="695" y="688" class="font box-title">候選 B</text>
    <text x="695" y="722" class="font body">「設備出現 E01 時請重新啟動」</text>
    <text x="695" y="756" class="font body">命中 E01，且屬於可引用的原文證據</text>
    <text x="695" y="793" class="mono small">重疊加權 ＋ 0.25 ＋ Hybrid 0.10 ＋ 0.05</text>
  </g>

  <path d="M 595 738 L 650 738" class="arrow"/>
  <text x="622" y="720" text-anchor="middle" class="font small">重排</text>

  <path d="M 1235 738 L 1310 738" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="1315" y="650" width="195" height="175" rx="18" fill="#173F5F"/>
    <text x="1412" y="697" text-anchor="middle" class="font white-title">候選 B 勝出</text>
    <text x="1412" y="735" text-anchor="middle" class="font white-body">依總分降冪排序</text>
    <text x="1412" y="766" text-anchor="middle" class="font white-body">同分時維持</text>
    <text x="1412" y="792" text-anchor="middle" class="font white-body">Hybrid 原始順序</text>
  </g>

  <!-- Final output -->
  <path d="M 800 825 L 800 868" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="360" y="870" width="880" height="90" rx="20" fill="#173F5F"/>
    <text x="800" y="907" text-anchor="middle" class="font white-title">4　截取最終 Top K 證據，交給回答 LLM</text>
    <text x="800" y="938" text-anchor="middle" class="font white-body">每筆加入 rerank_score，matched_by 標記為 local-reranker</text>
  </g>
</svg>
