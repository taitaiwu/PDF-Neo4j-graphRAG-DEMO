<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">HybridCypherRetriever 混合檢索流程</title><desc id="desc">問題同時進行向量與全文搜尋，融合後依序執行文件過濾、二輪原文回查證據擴展、可選重排，最後由語言模型回答。</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#F8FBFE"/><stop offset="1" stop-color="#E9F2F7"/></linearGradient>
<filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dy="4" stdDeviation="5" flood-color="#17324D" flood-opacity=".12"/></filter>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#587387"/></marker>
<style>.f{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.t{font-size:38px;font-weight:700;fill:#17324D}.st{font-size:18px;fill:#60788C}.h{font-size:21px;font-weight:700;fill:#17324D}.b{font-size:16px;fill:#405B70}.e{font-size:15px;font-weight:600;fill:#1E6088}.n{font-size:15px;font-weight:700;fill:#fff}.wt{font-size:22px;font-weight:700;fill:#fff}.wb{font-size:16px;fill:#EAF7FF}.ar{fill:none;stroke:#587387;stroke-width:3;marker-end:url(#a)}.connector{fill:none;stroke:#8AA0B1;stroke-width:2.5}</style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<text x="800" y="48" text-anchor="middle" class="f t">HybridCypherRetriever 混合檢索流程</text>
<text x="800" y="78" text-anchor="middle" class="f st">汽車維修例：「汽車出現 P0301 故障碼，該如何處理？」</text>

<!-- Question -->
<g filter="url(#s)"><rect x="530" y="105" width="540" height="78" rx="20" fill="#173F5F"/><circle cx="575" cy="144" r="18" fill="#2D78A3"/><text x="575" y="150" text-anchor="middle" class="f n">1</text><text x="625" y="151" class="f wt">使用者問題</text></g>
<path d="M735 183C680 210 520 205 400 228" class="connector"/><path d="M865 183C920 210 1080 205 1200 228" class="connector"/>

<!-- Search lanes -->
<g filter="url(#s)"><rect x="100" y="230" width="600" height="155" rx="20" fill="#E3F2FD" stroke="#3C91C7" stroke-width="2"/><circle cx="145" cy="275" r="18" fill="#3C91C7"/><text x="145" y="281" text-anchor="middle" class="f n">A</text><text x="205" y="277" class="f h">向量搜尋「證據節點」</text><text x="125" y="307" class="f b">搜尋三類節點：原文 Chunk／實體描述／關係描述</text><text x="125" y="337" class="f b">每個證據節點皆有 Embedding</text><text x="125" y="365" class="f e">以 cosine similarity 找出語意相近內容</text></g>

<g filter="url(#s)"><rect x="900" y="230" width="600" height="155" rx="20" fill="#FFF3E0" stroke="#E29A2D" stroke-width="2"/><circle cx="945" cy="275" r="18" fill="#E29A2D"/><text x="945" y="281" text-anchor="middle" class="f n">B</text><text x="1005" y="277" class="f h">全文搜尋「證據節點」</text><text x="925" y="307" class="f b">搜尋同一批證據節點的文字內容</text><text x="925" y="337" class="f b">原文 Chunk 節點保存完整文字與 Embedding</text><text x="925" y="365" class="f e">精確搜尋故障碼、型號與實體名稱</text></g>

<path d="M400 385C490 420 620 410 690 438" class="connector"/><path d="M1200 385C1110 420 980 410 910 438" class="connector"/>

<!-- Merge -->
<g filter="url(#s)"><rect x="500" y="440" width="600" height="95" rx="20" fill="#EDE8FA" stroke="#7659C5" stroke-width="2"/><circle cx="545" cy="487" r="18" fill="#7659C5"/><text x="545" y="493" text-anchor="middle" class="f n">2</text><text x="605" y="477" class="f h">HybridCypherRetriever 融合排名</text><text x="585" y="508" class="f b">naive ranker 正規化並合併兩路結果</text><text x="585" y="529" class="f e">effective_search_ratio = 3</text></g>
<path d="M800 535C700 555 480 550 295 567" class="ar"/>

<!-- Linear post-processing -->
<g filter="url(#s)"><rect x="80" y="570" width="430" height="135" rx="19" fill="#FFFFFF" stroke="#668399" stroke-width="2"/><circle cx="122" cy="611" r="18" fill="#668399"/><text x="122" y="617" text-anchor="middle" class="f n">3</text><text x="170" y="617" class="f h">Cypher 文件範圍過濾</text><text x="105" y="645" class="f b">避免混入其他文件的證據</text><text x="105" y="677" class="f e">只保留汽車維修手冊的結果</text></g>
<path d="M510 637H583" class="ar"/>

<g filter="url(#s)"><rect x="585" y="570" width="430" height="135" rx="19" fill="#FFF8E6" stroke="#D69E2E" stroke-width="2"/><circle cx="627" cy="611" r="18" fill="#D69E2E"/><text x="627" y="617" text-anchor="middle" class="f n">4</text><text x="675" y="617" class="f h">Evidence Expansion</text><text x="610" y="642" class="f b">依名稱與 Chunk 補充實體、關係及原文</text><text x="610" y="671" class="f e">新增來源再受限回查一次原文</text><text x="610" y="695" class="f e">第二輪完成後停止，不再遞迴</text></g>
<path d="M1015 637H1088" class="ar"/>

<g filter="url(#s)"><rect x="1090" y="570" width="430" height="135" rx="19" fill="#E8F7F0" stroke="#35976A" stroke-width="2"/><circle cx="1132" cy="611" r="18" fill="#35976A"/><text x="1132" y="617" text-anchor="middle" class="f n">5</text><text x="1180" y="617" class="f h">Local Reranker（可選）</text><text x="1115" y="642" class="f b">先召回 Top K × 3（最多 50 筆）</text><text x="1115" y="671" class="f e">依詞彙重疊、完整命中與融合分數重排</text></g>
<path d="M1305 705C1260 750 1090 752 1035 767" class="ar"/>

<!-- Answer -->
<g filter="url(#s)"><rect x="450" y="770" width="700" height="100" rx="21" fill="#173F5F"/><circle cx="498" cy="820" r="18" fill="#2D78A3"/><text x="498" y="826" text-anchor="middle" class="f n">6</text><text x="548" y="812" class="f wt">LLM 依證據產生答案</text><text x="540" y="841" class="f wb">建議檢查第 1 缸火星塞，並標示維修手冊頁碼</text></g>
</svg>