<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">HybridCypherRetriever 混合檢索流程</title>
  <desc id="desc">從使用者問題開始，分別進行向量搜尋與全文搜尋，融合排序、範圍過濾、可選重排及圖譜擴展後交由語言模型回答。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAFC"/>
      <stop offset="1" stop-color="#EAF2F8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#18324A" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#46627A"/>
    </marker>
    <style>
      .font { font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
      .title { font-size: 38px; font-weight: 700; fill: #17324D; }
      .subtitle { font-size: 18px; fill: #587086; }
      .box-title { font-size: 22px; font-weight: 700; fill: #17324D; }
      .body { font-size: 16px; fill: #425B70; }
      .small { font-size: 14px; fill: #587086; }
      .white-title { font-size: 22px; font-weight: 700; fill: #FFFFFF; }
      .white-body { font-size: 16px; fill: #EAF7FF; }
      .arrow { fill: none; stroke: #46627A; stroke-width: 3; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #7A8FA3; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <text x="800" y="58" text-anchor="middle" class="font title">HybridCypherRetriever 混合檢索流程</text>
  <text x="800" y="88" text-anchor="middle" class="font subtitle">語意搜尋 × 精確詞彙 × Cypher 範圍限制 × 圖譜關聯擴展</text>

  <!-- User question -->
  <g filter="url(#shadow)">
    <rect x="590" y="115" width="420" height="82" rx="20" fill="#173F5F"/>
    <text x="800" y="150" text-anchor="middle" class="font white-title">① 使用者輸入問題</text>
    <text x="800" y="178" text-anchor="middle" class="font white-body">例如：「E01 錯誤應如何處理？」</text>
  </g>

  <!-- Split arrows -->
  <path d="M 740 197 C 700 230, 525 226, 420 258" class="arrow"/>
  <path d="M 860 197 C 900 230, 1075 226, 1180 258" class="arrow"/>

  <!-- Vector lane -->
  <g filter="url(#shadow)">
    <rect x="145" y="260" width="550" height="155" rx="20" fill="#E3F2FD" stroke="#2196F3" stroke-width="2"/>
    <circle cx="193" cy="306" r="24" fill="#2196F3"/>
    <text x="193" y="313" text-anchor="middle" class="font white-title">A</text>
    <text x="232" y="302" class="font box-title">向量語意搜尋</text>
    <text x="232" y="332" class="font body">以建圖時相同的 Embedding 模型產生問題向量</text>
    <text x="232" y="359" class="font body">查詢 graph_evidence_embedding_&lt;維度&gt;</text>
    <text x="232" y="386" class="font small">擅長：同義詞、語意相近但用字不同的描述</text>
  </g>

  <!-- Fulltext lane -->
  <g filter="url(#shadow)">
    <rect x="905" y="260" width="550" height="155" rx="20" fill="#FFF3E0" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="953" cy="306" r="24" fill="#F59E0B"/>
    <text x="953" y="313" text-anchor="middle" class="font white-title">B</text>
    <text x="992" y="302" class="font box-title">CJK 全文關鍵字搜尋</text>
    <text x="992" y="332" class="font body">跳脫 Lucene 特殊符號後，以問題原文查詢</text>
    <text x="992" y="359" class="font body">查詢 graph_evidence_fulltext</text>
    <text x="992" y="386" class="font small">擅長：錯誤碼、型號、實體名稱與精確術語</text>
  </g>

  <!-- Merge arrows -->
  <path d="M 420 415 C 500 452, 620 452, 690 478" class="arrow"/>
  <path d="M 1180 415 C 1100 452, 980 452, 910 478" class="arrow"/>

  <!-- Hybrid merge -->
  <g filter="url(#shadow)">
    <rect x="505" y="478" width="590" height="108" rx="20" fill="#E8E5FA" stroke="#7357C8" stroke-width="2"/>
    <text x="800" y="515" text-anchor="middle" class="font box-title">② 官方 HybridCypherRetriever 融合排名</text>
    <text x="800" y="546" text-anchor="middle" class="font body">naive ranker 正規化並合併兩路結果</text>
    <text x="800" y="571" text-anchor="middle" class="font small">effective_search_ratio = 3，擴大底層候選範圍</text>
  </g>

  <path d="M 800 586 L 800 622" class="arrow"/>

  <!-- Filtering -->
  <g filter="url(#shadow)">
    <rect x="250" y="625" width="500" height="105" rx="18" fill="#FFFFFF" stroke="#5D7C91" stroke-width="2"/>
    <text x="500" y="663" text-anchor="middle" class="font box-title">③ 自訂 Cypher 範圍過濾</text>
    <text x="500" y="694" text-anchor="middle" class="font body">限制 run_id 與指定 PDF 文件</text>
    <text x="500" y="716" text-anchor="middle" class="font small">避免混入其他專案、批次或文件的證據</text>
  </g>

  <!-- Reranker -->
  <g filter="url(#shadow)">
    <rect x="850" y="625" width="500" height="105" rx="18" fill="#E8F7F0" stroke="#2E9D68" stroke-width="2"/>
    <text x="1100" y="663" text-anchor="middle" class="font box-title">④ 可選：本機 Reranker</text>
    <text x="1100" y="694" text-anchor="middle" class="font body">先召回 Top K × 3（最多 50 筆）再重排</text>
    <text x="1100" y="716" text-anchor="middle" class="font small">依詞彙重疊、完整命中、融合分數與證據類型評分</text>
  </g>

  <path d="M 800 586 C 800 610, 700 610, 680 625" class="arrow"/>
  <path d="M 750 677 L 850 677" class="dash"/>

  <!-- Final stages -->
  <path d="M 500 730 C 500 755, 600 756, 650 770" class="arrow"/>
  <path d="M 1100 730 C 1100 755, 1000 756, 950 770" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="380" y="770" width="510" height="90" rx="18" fill="#FFF8E6" stroke="#D69E2E" stroke-width="2"/>
    <text x="635" y="807" text-anchor="middle" class="font box-title">⑤ GraphRAG：可選關聯擴展</text>
    <text x="635" y="837" text-anchor="middle" class="font body">補回來源 Chunk、相關實體及相連關係</text>
  </g>

  <path d="M 890 815 L 970 815" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="970" y="770" width="410" height="90" rx="18" fill="#173F5F"/>
    <text x="1175" y="807" text-anchor="middle" class="font white-title">⑥ LLM 依證據產生答案</text>
    <text x="1175" y="837" text-anchor="middle" class="font white-body">附 PDF 文件、頁碼與 Chunk 出處</text>
  </g>

  <!-- Legend -->
  <text x="74" y="847" class="font small">實線：主要資料流</text>
  <line x1="74" y1="866" x2="126" y2="866" class="arrow"/>
  <text x="148" y="871" class="font small">虛線：啟用 Reranker 時</text>
</svg>
