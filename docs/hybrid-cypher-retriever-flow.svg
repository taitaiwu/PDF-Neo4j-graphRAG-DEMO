<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#F8FBFE"/><stop offset="1" stop-color="#EAF3F8"/></linearGradient><filter id="s"><feDropShadow dy="4" stdDeviation="5" flood-opacity=".14"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#526F84"/></marker><style>.f{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.t{font-size:40px;font-weight:700;fill:#17324D}.st{font-size:19px;fill:#60788C}.n{font-size:18px;font-weight:700;fill:#fff}.ct{font-size:23px;font-weight:700;fill:#17324D}.b{font-size:17px;fill:#405B70}.e{font-size:16px;font-weight:600;fill:#1E5577}.wt{font-size:23px;font-weight:700;fill:#fff}.wb{font-size:17px;fill:#EAF7FF}.ar{fill:none;stroke:#526F84;stroke-width:3;marker-end:url(#a)}</style></defs>
<rect width="1600" height="900" fill="url(#bg)"/><text x="800" y="55" text-anchor="middle" class="f t">系統如何從問題找到答案？</text><text x="800" y="87" text-anchor="middle" class="f st">HybridCypherRetriever 白話流程｜用同一個例子看懂每一步</text>
<g filter="url(#s)"><rect x="465" y="115" width="670" height="94" rx="22" fill="#173F5F"/><circle cx="515" cy="162" r="27" fill="#2D78A3"/><text x="515" y="168" text-anchor="middle" class="f n">1</text><text x="565" y="151" class="f wt">使用者提出問題</text><text x="565" y="182" class="f wb">例：「印表機出現 E01 錯誤，該怎麼處理？」</text></g><path d="M735 209C680 235 520 225 420 257" class="ar"/><path d="M865 209C920 235 1080 225 1180 257" class="ar"/>
<g filter="url(#s)"><rect x="115" y="260" width="590" height="158" rx="22" fill="#E3F2FD" stroke="#3C91C7" stroke-width="2"/><circle cx="165" cy="308" r="27" fill="#3C91C7"/><text x="165" y="314" text-anchor="middle" class="f n">2A</text><text x="210" y="302" class="f ct">理解問題的意思</text><text x="210" y="334" class="f b">尋找「意思相近」的文件內容，</text><text x="210" y="362" class="f b">不要求問題與文件使用完全相同的文字。</text><rect x="210" y="378" width="450" height="27" rx="8" fill="#fff"/><text x="225" y="398" class="f e">找到：「設備無法啟動時，先檢查電源連接。」</text></g>
<g filter="url(#s)"><rect x="895" y="260" width="590" height="158" rx="22" fill="#FFF3E0" stroke="#E29A2D" stroke-width="2"/><circle cx="945" cy="308" r="27" fill="#E29A2D"/><text x="945" y="314" text-anchor="middle" class="f n">2B</text><text x="990" y="302" class="f ct">尋找明確關鍵字</text><text x="990" y="334" class="f b">直接尋找錯誤碼、設備名稱、型號等</text><text x="990" y="362" class="f b">必須精確命中的重要詞彙。</text><rect x="990" y="378" width="450" height="27" rx="8" fill="#fff"/><text x="1005" y="398" class="f e">找到：「E01：進紙匣未正確安裝。」</text></g><path d="M410 418C500 457 610 448 684 477" class="ar"/><path d="M1190 418C1100 457 990 448 916 477" class="ar"/>
<g filter="url(#s)"><rect x="420" y="480" width="760" height="112" rx="22" fill="#EDE8FA" stroke="#7659C5" stroke-width="2"/><circle cx="475" cy="536" r="27" fill="#7659C5"/><text x="475" y="542" text-anchor="middle" class="f n">3</text><text x="520" y="523" class="f ct">合併兩種搜尋結果，排出優先順序</text><text x="520" y="553" class="f b">同時考慮「意思相近」與「關鍵字吻合」的內容。</text><text x="520" y="579" class="f e">例：把直接提到 E01 的處理說明排在一般故障說明之前。</text></g><path d="M800 592V625" class="ar"/>
<g filter="url(#s)"><rect x="105" y="628" width="640" height="115" rx="22" fill="#fff" stroke="#668399" stroke-width="2"/><circle cx="157" cy="686" r="27" fill="#668399"/><text x="157" y="692" text-anchor="middle" class="f n">4</text><text x="202" y="673" class="f ct">只保留本次需要的文件</text><text x="202" y="703" class="f b">排除其他專案、其他版本或未選取文件的內容。</text><text x="202" y="729" class="f e">例：只採用「印表機 A 操作手冊」，不混入印表機 B。</text></g>
<g filter="url(#s)"><rect x="855" y="628" width="640" height="115" rx="22" fill="#E8F7F0" stroke="#35976A" stroke-width="2"/><circle cx="907" cy="686" r="27" fill="#35976A"/><text x="907" y="692" text-anchor="middle" class="f n">5</text><text x="952" y="673" class="f ct">補充前後文與相關知識</text><text x="952" y="703" class="f b">找回該段原文，以及相關零件、原因與處理關係。</text><text x="952" y="729" class="f e">例：補上「取出紙匣 → 重新安裝 → 重新啟動」。</text></g><path d="M745 686H855" class="ar"/><path d="M1175 743C1120 772 1015 775 955 795" class="ar"/>
<g filter="url(#s)"><rect x="365" y="790" width="870" height="84" rx="22" fill="#173F5F"/><circle cx="417" cy="832" r="27" fill="#2D78A3"/><text x="417" y="838" text-anchor="middle" class="f n">6</text><text x="465" y="820" class="f wt">根據找到的證據產生答案</text><text x="465" y="850" class="f wb">例：「重新安裝進紙匣後再啟動設備（印表機 A 操作手冊，第 12 頁）。」</text></g></svg>