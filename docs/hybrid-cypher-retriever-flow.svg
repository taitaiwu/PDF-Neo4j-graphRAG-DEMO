<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">HybridCypherRetriever 簡明流程</title><desc id="desc">以 E01 錯誤為例的混合檢索、圖譜擴展、重排與回答流程。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#F8FBFE"/><stop offset="1" stop-color="#EAF3F8"/></linearGradient><filter id="s"><feDropShadow dy="3" stdDeviation="4" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#526F84"/></marker><style>.f{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}.t{font-size:38px;font-weight:700;fill:#17324D}.st{font-size:18px;fill:#60788C}.h{font-size:21px;font-weight:700;fill:#17324D}.b{font-size:16px;fill:#405B70}.e{font-size:15px;font-weight:600;fill:#1E6088}.wt{font-size:21px;font-weight:700;fill:#fff}.wb{font-size:16px;fill:#EAF7FF}.n{font-size:17px;font-weight:700;fill:#fff}.ar{fill:none;stroke:#526F84;stroke-width:3;marker-end:url(#a)}</style></defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<text x="800" y="52" text-anchor="middle" class="f t">HybridCypherRetriever 簡明流程</text>
<text x="800" y="82" text-anchor="middle" class="f st">例：「印表機出現 E01，該怎麼處理？」｜Top K = 5</text>

<g filter="url(#s)"><rect x="500" y="110" width="600" height="88" rx="18" fill="#173F5F"/><circle cx="545" cy="154" r="23" fill="#2D78A3"/><text x="545" y="160" text-anchor="middle" class="f n">1</text><text x="585" y="145" class="f wt">Question Embedding</text><text x="585" y="174" class="f wb">問題 → 向量 [0.021, −0.136, 0.084, …]</text></g>
<path d="M745 198C690 225 535 216 440 247" class="ar"/><path d="M855 198C910 225 1065 216 1160 247" class="ar"/>

<g filter="url(#s)"><rect x="120" y="250" width="600" height="125" rx="18" fill="#E3F2FD" stroke="#3C91C7" stroke-width="2"/><circle cx="163" cy="292" r="23" fill="#3C91C7"/><text x="163" y="298" text-anchor="middle" class="f n">2A</text><text x="203" y="285" class="f h">Vector Search</text><text x="203" y="314" class="f b">cos(q,d) = q·d / (‖q‖‖d‖)</text><text x="203" y="344" class="f e">找到語意相近：「設備無法啟動」</text></g>
<g filter="url(#s)"><rect x="880" y="250" width="600" height="125" rx="18" fill="#FFF3E0" stroke="#E29A2D" stroke-width="2"/><circle cx="923" cy="292" r="23" fill="#E29A2D"/><text x="923" y="298" text-anchor="middle" class="f n">2B</text><text x="963" y="285" class="f h">Full-text Search</text><text x="963" y="314" class="f b">CJK analyzer ＋ Lucene 關鍵字查詢</text><text x="963" y="344" class="f e">精確找到：「E01」、「進紙匣」</text></g>
<path d="M420 375C500 410 620 405 680 432" class="ar"/><path d="M1180 375C1100 410 980 405 920 432" class="ar"/>

<g filter="url(#s)"><rect x="430" y="435" width="740" height="100" rx="18" fill="#EDE8FA" stroke="#7659C5" stroke-width="2"/><circle cx="475" cy="485" r="23" fill="#7659C5"/><text x="475" y="491" text-anchor="middle" class="f n">3</text><text x="515" y="472" class="f h">HybridCypherRetriever：naive ranker</text><text x="515" y="501" class="f b">正規化並融合兩路排名｜effective_search_ratio = 3</text><text x="515" y="525" class="f e">E01 且語意相近的處理段落優先</text></g>
<path d="M800 535V570" class="ar"/>

<g filter="url(#s)"><rect x="85" y="573" width="450" height="120" rx="18" fill="#fff" stroke="#668399" stroke-width="2"/><circle cx="127" cy="613" r="23" fill="#668399"/><text x="127" y="619" text-anchor="middle" class="f n">4</text><text x="167" y="606" class="f h">Cypher Filter</text><text x="108" y="642" class="f b">限定本次 run_id 與指定 PDF</text><text x="108" y="671" class="f e">只採用「印表機 A 操作手冊」</text></g>
<path d="M535 633H575" class="ar"/>

<g filter="url(#s)"><rect x="580" y="573" width="440" height="120" rx="18" fill="#E8F7F0" stroke="#35976A" stroke-width="2"/><circle cx="622" cy="613" r="23" fill="#35976A"/><text x="622" y="619" text-anchor="middle" class="f n">5</text><text x="662" y="606" class="f h">Graph Expansion（可選）</text><text x="603" y="642" class="f b">補回 Chunk、實體與關係</text><text x="603" y="671" class="f e">E01 → 進紙匣 → 重新安裝</text></g>
<path d="M1020 633H1060" class="ar"/>

<g filter="url(#s)"><rect x="1065" y="573" width="450" height="120" rx="18" fill="#FFF8E6" stroke="#D69E2E" stroke-width="2"/><circle cx="1107" cy="613" r="23" fill="#D69E2E"/><text x="1107" y="619" text-anchor="middle" class="f n">6</text><text x="1147" y="606" class="f h">Local Reranker（可選）</text><text x="1088" y="642" class="f b">候選 = min(Top K × 3, 50) = 15</text><text x="1088" y="671" class="f e">詞彙重疊×2＋命中×0.25＋融合分數＋原文0.05</text></g>
<path d="M1290 693V735H1040" class="ar"/>

<g filter="url(#s)"><rect x="380" y="735" width="840" height="105" rx="19" fill="#173F5F"/><circle cx="425" cy="787" r="23" fill="#2D78A3"/><text x="425" y="793" text-anchor="middle" class="f n">7</text><text x="465" y="776" class="f wt">LLM Answer｜temperature = 0</text><text x="465" y="807" class="f wb">「重新安裝進紙匣後再啟動設備（印表機 A 手冊，第 12 頁）。」</text></g>
<text x="800" y="875" text-anchor="middle" class="f st">HybridCypherRetriever：步驟 2–4｜本系統接續：步驟 5–7</text>
</svg>